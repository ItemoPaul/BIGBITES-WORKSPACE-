<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=./our%20website.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Bites Eatery</title>
  <style>
    :root {
      --bg1: #d32f2f;
      --bg2: #ff9800;
      --text: #fff;
      --accent: #ff5722;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(to right, var(--bg1), var(--bg2));
      color: var(--text);
      text-align: center;
    }

    .redirect-box {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 2rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      max-width: 520px;
      width: calc(100% - 2rem);
    }

    h1 {
      margin: 0 0 1rem;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
    }

    p {
      margin: 0 0 1.25rem;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      background: var(--accent);
      color: var(--text);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.8rem 1.2rem;
      font-weight: 700;
    }

    a:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <h1>Big Bites Eatery</h1>
    <p>Redirecting to the homepage...</p>
    <a href="./our%20website.html">Open the homepage</a>
  </div>
</body>
</html>
